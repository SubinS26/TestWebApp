<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram • Video Sharing</title>
    <meta name="description" content="Share and explore reels, photos, videos, and stories." />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Satisfy" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.0.10/css/all.css" integrity="sha384-+d0P83n9kaQMCwj8F4RJB66tzIwOKmrdb46+porD/OvrJ+37WqIM7UoBtwHO6Nlg" crossorigin="anonymous" >
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="/styles/styles.css">
    <link rel="stylesheet" href="/styles/instagram-theme.css">
  </head>
  <body>
    <div class="handy-notify">
      <span></span>
    </div>
    <div class="overlay-2-black"></div>
    <div class="overlay-2"></div>
    <div
      class="data"
      id="data"
      data-session=""
      data-username=""
      data-email-verified="true"
      data-loggedin="false"
      data-isadmin="false"
    ></div>
    <div id="root">
      <div class="preload">
        <div class="preload_spinner">
          <div class="spinner">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/bundle.js"></script>
  </body>
</html>
