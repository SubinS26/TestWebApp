apiVersion: apps/v1
kind: Deployment
metadata:
  name: videoshare-deployment
  namespace: videoshare-prod
  labels:
    app.kubernetes.io/name: videoshare
    app.kubernetes.io/component: backend-frontend-api
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: videoshare
  template:
    metadata:
      labels:
        app: videoshare
        environment: production
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: videoshare-app
          image: subinshrestha/videoshare-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4300
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: videoshare-config
            - secretRef:
                name: videoshare-secret
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4300
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4300
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: media-storage
              mountPath: /app/dist/posts
              subPath: posts
            - name: media-storage
              mountPath: /app/dist/comments
              subPath: comments
            - name: temp-storage
              mountPath: /app/dist/temp
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: videoshare-media-pvc
        - name: temp-storage
          emptyDir: {}
